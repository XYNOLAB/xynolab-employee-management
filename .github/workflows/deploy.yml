name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
      # - staging

jobs:
  build_and_deploy:
    runs-on: self-hosted
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setting some github env
        run: |
          echo "BRANCH=${GITHUB_REF_NAME,,}" >> $GITHUB_ENV
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "SERVER_IP=${{ secrets.SERVER_IP }}" >> $GITHUB_ENV
          echo "API_PORT=${{ secrets.API_PORT }}" >> $GITHUB_ENV
          echo "ADMIN_PORT=${{ secrets.ADMIN_PORT }}" >> $GITHUB_ENV

      - name: Create .env from ENV_FILE secret
        run: |
          cat > api/.env << 'EOF'
          ${{ secrets.ENV_FILE_API }}
          EOF
          cat > admin/.env << 'EOF'
          ${{ secrets.ENV_FILE_ADMIN }}
          EOF

      - name: Build Docker image
        run: |
          docker build --progress=plain \
            -f Dockerfile \
            -t employee:$IMAGE_TAG \
            -t employee:$BRANCH-latest .

      # The self-hosted runners share ci-server (one home folder, one Docker daemon) with other
      # repos' jobs. Keep the key and known_hosts in this job's temp folder, and only remove
      # images this workflow built: never prune containers, images or volumes machine-wide.
      - name: Deploy to servers
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/employee-ssh-$GITHUB_RUN_ID"
          install -m 700 -d "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_rsa"
          printf "%s\n" "$SSH_PRIVATE_KEY" > "$ssh_dir/id_rsa"
          ssh-keyscan -H "$SERVER_IP" > "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/id_rsa" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")

          docker save -o employee.tar employee:$IMAGE_TAG employee:$BRANCH-latest

          echo "Deploying to $SERVER_IP"

          scp "${ssh_opts[@]}" employee.tar ubuntu@$SERVER_IP:/tmp

          ssh "${ssh_opts[@]}" ubuntu@$SERVER_IP <<EOF


            docker images -q --filter "reference=employee" | xargs -r docker rmi -f
            docker load -i /tmp/employee.tar
            docker ps -q --filter name=employee-${{ env.BRANCH }} | xargs -r docker stop
            docker ps -a -q --filter "name=employee-${{ env.BRANCH }}" | xargs -r docker rm

            docker run -d --restart=always -p ${{ env.API_PORT }}:8000 -p ${{ env.ADMIN_PORT }}:3000 --name employee-${{ env.BRANCH }} employee:${{ env.BRANCH }}-latest

            # Dangling images only: this server may host other apps whose unused images
            # (e.g. rollback builds) must stay.
            docker image prune -f

            rm -f /tmp/employee.tar
          EOF

      - name: Clean up runner
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/employee-ssh-$GITHUB_RUN_ID" employee.tar
          # Only this repo's images. No -f: an image in use is skipped.
          docker images employee --format '{{.Repository}}:{{.Tag}}' | xargs -r docker rmi || true
          docker image prune -f > /dev/null || true
